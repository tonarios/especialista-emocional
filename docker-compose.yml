services:
  db:
    image: postgres:16-alpine
    container_name: ah-emociones-db
    environment:
      POSTGRES_USER: emociones
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-emociones_dev}
      POSTGRES_DB: emociones
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emociones -d emociones"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: ah-emociones-app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # El índice FAISS se genera en el HOST (scripts/index.sh, necesita Ollama)
      # y se monta en solo lectura (§11).
      - ./data/index:/app/data/index:ro
    environment:
      # Secretos SOLO por variables de entorno del shell anfitrión
      # (nunca env_file ni .env dentro del contenedor).
      POSTGRES_DSN: postgresql://emociones:${LOCAL_DB_PASSWORD:-emociones_dev}@db:5432/emociones
      JWT_SECRET: ${JWT_SECRET:-}
      LLM_MODEL: ${LLM_MODEL:-ollama/gemma4:latest}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      # Fijo: dentro del contenedor Ollama vive SIEMPRE en el host (no heredar
      # el OLLAMA_BASE_URL del .env, que apunta a localhost para correr sin Docker).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      INDEX_DIR: data/index
      ENVIRONMENT: local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
