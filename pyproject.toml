[project]
name = "ah-emociones"
version = "0.1.0"
description = "Especialista en enfermedades emocionales: RAG (FAISS + bge-m3) sobre un diccionario emocional, memoria persistente y autenticación (Google ADK 2.x + gemma4 vía Ollama)"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.0.0",
    "litellm>=1.84",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "greenlet>=3.5.5",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]
